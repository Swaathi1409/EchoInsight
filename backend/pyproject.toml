[tool.ruff]
target-version = "py311"
line-length = 100
src = ["backend", "tests", "evals", "data"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "T20"]
ignore = [
    "E501",   # line length handled by formatter
    "B008",   # FastAPI uses Depends() in function signatures by design
    "UP042",  # str+Enum is idiomatic for SQLAlchemy/Pydantic compat
    "N806",   # RATE_LIMIT intentional constant in function scope
    "B904",   # raise-from not required in all except clauses
    "E712",   # == True/False comparisons acceptable in SQLAlchemy filters
    "C416",   # list comprehension vs list() is stylistic
    "RUF059", # unused unpacked variable convention
    "F401", "F841", "E402", "E741", "E711", "W291", "W293"
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20", "F401", "F841"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "tests", "evals", "data"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_configs = true
disable_error_code = ["arg-type", "assignment", "attr-defined", "dict-item", "call-arg", "return-value", "union-attr", "var-annotated"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests that require a database",
    "slow: marks tests that are slow",
    "real_model: marks tests that require a real Groq API key",
]

[tool.coverage.run]
source = ["backend"]
omit = ["tests/*", "backend/alembic/*"]

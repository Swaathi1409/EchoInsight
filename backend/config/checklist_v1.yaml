# checklist_v1.yaml
# Versioned QA checklist configuration for EchoInsight.
# version: 1 (increment when any item changes; old analyses reference their version)
# policy_version: "v1"
#
# Administrators: edit items, weights, and critical flags here.
# After editing: POST /api/v1/admin/checklist to register as a new version.
# This file is the SOURCE OF TRUTH for the scorer; do not edit weights in code.

version: 1
policy_version: "v1"
taxonomy_version: 1
effective_date: "2024-01-01"
description: "Default QA checklist for Union Mobile contact center agents."

items:
  - id: greeting
    label: "Greeting"
    description: >
      Agent introduced themselves with their name and the company name within the
      first two agent turns. E.g. "Thank you for calling Union Mobile, my name is..."
    weight: 1.0
    critical: false
    applicable_when: always
    pass_condition: >
      Agent used their name and company name in an opening turn. Minor variations
      (e.g. shortened company name) are acceptable.
    fail_condition: >
      No name or company mentioned in any agent turn before asking for account details.
    not_applicable_when: >
      Customer opened with an emergency and agent immediately responded to the
      urgent matter; or the conversation contains only system-generated turns.

  - id: identity_verification
    label: "Identity Verification"
    description: >
      Agent verified the customer's identity before accessing or disclosing account
      information. Acceptable methods: account number, date of birth, PIN, security
      question. PINs and DOBs are redacted in the transcript; their presence is
      inferred from context (e.g. "Can you confirm your PIN?" + customer responds).
    weight: 2.0
    critical: true
    applicable_when: account_access_required
    pass_condition: >
      Agent asked for at least one verification factor and customer provided it
      before agent disclosed account-specific information.
    fail_condition: >
      Agent disclosed account-specific information (balance, plan details, etc.)
      without requesting any verification.
    not_applicable_when: >
      Call did not involve account access (e.g. general information query about
      coverage areas with no account lookup).

  - id: empathy
    label: "Empathy Acknowledgment"
    description: >
      Agent acknowledged the customer's frustration, inconvenience, or difficulty
      at least once during the call, using empathetic language.
    weight: 1.5
    critical: false
    applicable_when: customer_expressed_frustration
    pass_condition: >
      Agent used empathetic phrasing at least once: e.g. "I understand that's
      frustrating", "I'm sorry to hear that", "I appreciate your patience".
    fail_condition: >
      Customer expressed clear frustration or anger and agent gave no acknowledgment
      of the difficulty.
    not_applicable_when: >
      Customer was neutral or positive throughout the entire call; no frustration
      or difficulty was expressed.

  - id: disclosure
    label: "Fee and Limitation Disclosure"
    description: >
      Agent disclosed any applicable fees, plan limitations, or service conditions
      before the customer committed to an action (e.g. upgrade, add-on, technician
      visit charge, early termination fee).
    weight: 1.5
    critical: true
    applicable_when: fee_or_limitation_applicable
    pass_condition: >
      Agent stated the relevant fee or limitation clearly before customer agreed.
    fail_condition: >
      Agent recommended or processed an action that involves a fee or limitation
      without disclosing it.
    not_applicable_when: >
      No fee-bearing or limitation-triggering action was discussed or taken.

  - id: prohibited_promises
    label: "No Prohibited Promises"
    description: >
      Agent did not make guarantees about outcomes they cannot control: specific
      refund amounts, exact fix dates, guaranteed signal improvements in specific
      locations, or promises to override policy decisions.
    weight: 2.0
    critical: true
    applicable_when: always
    pass_condition: >
      All agent statements about outcomes were appropriately hedged ("we will aim
      to", "typically", "I will escalate and they will contact you") or were within
      the agent's authority to promise.
    fail_condition: >
      Agent guaranteed a specific outcome that is outside their direct control
      (e.g. "I guarantee your internet will be fixed by tomorrow").
    not_applicable_when: never

  - id: closure
    label: "Call Closure"
    description: >
      Agent summarized the next steps and/or thanked the customer before ending
      the call. Customer should not be left uncertain about what happens next.
    weight: 1.0
    critical: false
    applicable_when: always
    pass_condition: >
      Agent stated next steps clearly and/or thanked the customer. The call ended
      with the customer aware of what to expect.
    fail_condition: >
      Call ended without any summary of next steps or customer appreciation,
      leaving the customer uncertain.
    not_applicable_when: >
      Very short call (fewer than 3 agent turns) where the resolution was
      immediate and self-evident.

scoring:
  coverage_threshold: 0.7
  critical_violation_score_cap: 60
  needs_review_coverage_penalty: 0.5
  partial_pass_weight: 0.5

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: echoinsight
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: echoinsight
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U echoinsight"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://echoinsight:changeme@db:5432/echoinsight
      APP_ENV: development
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: python -m alembic upgrade head
    profiles:
      - migrate

  seed:
    build:
      context: backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://echoinsight:changeme@db:5432/echoinsight
      APP_ENV: development
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: python -m scripts.seed_users
    profiles:
      - seed

  api:
    build:
      context: backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://echoinsight:changeme@db:5432/echoinsight
      APP_ENV: development
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn backend.api.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://echoinsight:changeme@db:5432/echoinsight
      APP_ENV: development
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: python -m backend.worker.main
    profiles:
      - worker

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    profiles:
      - frontend

volumes:
  postgres_data:

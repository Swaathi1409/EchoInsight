# Production Docker Compose for EchoInsight
# Includes: Postgres, backend API, background worker, Nginx serving frontend static files.
# Run migrations once before API starts (one-shot service).
#
# Usage:
#   cp .env.example .env  # fill in real secrets
#   docker compose -f docker-compose.prod.yml up -d

version: "3.9"

x-backend-env: &backend-env
  DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://echo:${POSTGRES_PASSWORD}@db:5432/echoinsight}
  GROQ_API_KEY: ${GROQ_API_KEY}
  SECRET_KEY: ${SECRET_KEY}
  APP_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  SEED_USERS: ${SEED_USERS:-}
  LLM_PRIMARY_MODEL: ${LLM_PRIMARY_MODEL:-llama-3.3-70b-versatile}
  LLM_VERIFIER_MODEL: ${LLM_VERIFIER_MODEL:-llama-3.3-70b-versatile}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
  ENABLE_METRICS: "true"
  STORE_ORIGINAL_TEXT: "false"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: echo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: echoinsight
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U echo -d echoinsight"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512m

  migrate:
    image: echoinsight-backend:${IMAGE_TAG:-latest}
    command: ["alembic", "upgrade", "head"]
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 256m

  api:
    image: echoinsight-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512m

  worker:
    image: echoinsight-backend:${IMAGE_TAG:-latest}
    command: ["python", "-m", "backend.worker.main"]
    restart: unless-stopped
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 512m

  frontend:
    image: echoinsight-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128m

volumes:
  pgdata:
    driver: local
